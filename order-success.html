<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Successful - ShopEase</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            margin: 0;
        }

        .success-container {
            background: #fff;
            color: #333;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: popUp 0.8s ease forwards;
        }

        .checkmark {
            font-size: 80px;
            color: #28a745;
            animation: bounce 1s infinite;
        }

        h1 {
            font-size: 2rem;
            margin: 20px 0 10px;
            animation: fadeInDown 1s ease;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            animation: fadeIn 2s ease;
        }

        .btn {
            display: inline-block;
            background: #0072ff;
            color: #fff;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0056c7;
            transform: scale(1.05);
        }

        /* Animations */
        @keyframes popUp {
            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="success-container">
        <div class="checkmark">✅</div>
        <h1>Order Successful!</h1>
        <p>🎉 Thank you for shopping with <strong>ShopEase</strong>.
            Your payment has been received and your order is being processed.</p>
        <a href="products.html" class="btn">🛒 Continue Shopping</a>
    </div>
</body>

</html>
